name: Actualizar datos IPP/IPM

on:
  schedule:
    - cron: '0 15 16,18,20 * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install openpyxl

      - name: Ejecutar scraper
        run: python scripts/scrape_precios.py

      - name: Commit y push si hay datos nuevos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          # Commitear SOLO si cambió algún archivo de datos real. Si lo único que
          # cambió es el campo 'actualizado' (timestamp) de metadata.json, no se
          # commitea: así el historial no acumula commits-ruido sin datos nuevos.
          if git diff --staged --quiet -- data/ ':(exclude)data/metadata.json'; then
            echo "Sin datos nuevos (solo cambió el timestamp) — no se commitea"
          else
            git commit -m "datos: IPP/IPM $(date +%Y-%m-%d)"
            git push
          fi
