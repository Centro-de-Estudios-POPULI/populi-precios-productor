<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IPP e IPM · Populi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <style>
    :root {
      --populi:#8B1A1A;--populi-dark:#6B0300;--populi-light:#C00000;
      --cream:#F5EFE0;--brown-dark:#3D2B1F;
      --navy:#0D1B2A;--navy-light:#1A2940;--slate:#475569;--slate-light:#64748B;
      --warm-white:#FAF8F3;--border:#E2DDD3;--dark-border:#2A3A50;
      --bg:var(--warm-white);--card:#FFFFFF;--text:var(--brown-dark);--muted:var(--slate-light);
      --ct-ipp:#2563EB;--ct-ipm:#D97706;--ct-ref:#94A3B8;
      --radius:12px;
    }
    [data-theme="dark"]{--bg:#080808;--card:#141414;--text:#E2E8F0;--muted:#64748B;--border:#2A3A50;--cream:#1A2940}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
    .wrap{max-width:1200px;margin:0 auto;padding:20px 16px}
    .sec-title{font-family:'Playfair Display',Georgia,serif;font-size:1.55rem;font-weight:700;color:var(--navy);display:flex;align-items:center;gap:10px;line-height:1.15;margin-bottom:2px}
    [data-theme="dark"] .sec-title{color:#fff}
    .accent-bar{width:4px;height:26px;background:var(--ct-ipp);border-radius:2px;flex-shrink:0}
    .sec-sub{font-size:.78rem;color:var(--muted);padding-left:14px;margin-bottom:16px}
    [data-theme="dark"] .sec-sub{color:rgba(255,255,255,.4)}

    .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
    @media(max-width:700px){.kpi-grid{grid-template-columns:repeat(2,1fr)}}
    .kpi{background:var(--warm-white);border:1px solid var(--border);border-radius:10px;padding:12px 14px;position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s}
    [data-theme="dark"] .kpi{background:#141414;border-color:var(--dark-border)}
    .kpi:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,.08)}
    .kpi::after{content:'';position:absolute;top:0;left:0;width:100%;height:3px}
    .kpi[data-s="ipp"]::after{background:var(--ct-ipp)}
    .kpi[data-s="ipm"]::after{background:var(--ct-ipm)}
    .kpi-lbl{font-size:.62rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px}
    [data-theme="dark"] .kpi-lbl{color:rgba(255,255,255,.4)}
    .kpi-val{font-family:'JetBrains Mono',monospace;font-size:1.25rem;font-weight:700}
    .kpi-d{display:inline-flex;align-items:center;gap:3px;font-family:'JetBrains Mono',monospace;font-size:.68rem;font-weight:600;padding:1px 7px;border-radius:5px;margin-top:5px}
    .kpi-d.up{background:rgba(199,30,29,.08);color:#C71E1D}
    .kpi-d.down{background:rgba(5,150,105,.08);color:#059669}
    .kpi-d.flat{background:rgba(100,116,139,.08);color:#64748B}
    [data-theme="dark"] .kpi-d.up{background:rgba(199,30,29,.15)}
    [data-theme="dark"] .kpi-d.down{background:rgba(5,150,105,.15)}

    .main-grid{display:grid;grid-template-columns:3fr 2fr;grid-template-rows:540px;gap:16px}
    @media(max-width:900px){.main-grid{grid-template-columns:1fr;grid-template-rows:480px auto}}
    @media(min-width:1100px){.main-grid{grid-template-rows:580px}}

    .chart-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;height:100%;overflow:hidden}
    [data-theme="dark"] .chart-card{background:#141414;border-color:var(--dark-border)}
    .chart-ctrl{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
    .tog-grp{display:flex;gap:6px;flex-wrap:wrap}
    .pill{display:flex;align-items:center;gap:5px;padding:4px 12px;border:1.5px solid;border-radius:8px;background:transparent;cursor:pointer;font-family:'Inter',sans-serif;font-size:.68rem;font-weight:600;transition:all .2s}
    .pill:hover{transform:translateY(-1px);box-shadow:0 2px 8px rgba(0,0,0,.08)}
    .pill .dot{width:8px;height:8px;border-radius:50%}
    .rng-grp{display:flex;gap:4px}
    .rng{padding:3px 10px;border:1px solid var(--border);border-radius:6px;background:transparent;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:.65rem;font-weight:600;color:var(--muted);transition:all .18s}
    .rng.act{background:var(--navy);color:#fff;border-color:var(--navy)}
    [data-theme="dark"] .rng{border-color:var(--dark-border)}
    [data-theme="dark"] .rng.act{background:#fff;color:#0D1B2A}
    .chart-area{flex:1;min-height:0}

    .panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:14px;height:100%;overflow-y:auto}
    [data-theme="dark"] .panel{background:#141414;border-color:var(--dark-border)}
    .panel-title{font-family:'Playfair Display',Georgia,serif;font-size:1.05rem;font-weight:700;color:var(--navy)}
    [data-theme="dark"] .panel-title{color:#fff}
    .ctx-box{background:var(--cream);border-radius:10px;padding:14px;font-size:.82rem;line-height:1.55}
    [data-theme="dark"] .ctx-box{background:#1A2940}
    .ctx-box strong{color:var(--navy)}
    [data-theme="dark"] .ctx-box strong{color:#93C5FD}
    .lbl-row{display:flex;align-items:center;gap:8px;padding:6px 0}
    .lbl-color{width:12px;height:12px;border-radius:3px;flex-shrink:0}
    .lbl-name{font-size:.78rem;font-weight:600;flex:1}
    .lbl-val{font-family:'JetBrains Mono',monospace;font-size:.82rem;font-weight:700}
    .ampliar{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:auto;padding:10px;border:1.5px solid var(--border);border-radius:10px;font-size:.78rem;font-weight:600;color:var(--muted);text-decoration:none;transition:all .2s}
    .ampliar:hover{border-color:var(--ct-ipp);color:var(--ct-ipp);background:rgba(37,99,235,.04)}

    .edu-section{margin-top:16px}
    .edu{border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:8px;transition:border-color .2s}
    [data-theme="dark"] .edu{border-color:var(--dark-border)}
    .edu:hover{border-color:var(--ct-ipp)}
    .edu-tog{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;cursor:pointer;user-select:none}
    .edu-t{font-size:.82rem;font-weight:700;color:var(--navy)}
    [data-theme="dark"] .edu-t{color:#fff}
    .edu-arr{font-size:.6rem;color:var(--muted);transition:transform .25s}
    .edu.open .edu-arr{transform:rotate(180deg)}
    .edu-c{max-height:0;overflow:hidden;transition:max-height .35s ease,padding .35s ease;padding:0 16px;font-size:.8rem;line-height:1.6}
    .edu.open .edu-c{max-height:600px;padding:0 16px 14px}
    .edu-c p{margin-bottom:8px}

    .foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:16px;padding-top:12px;border-top:1px solid var(--border);font-size:.68rem;color:var(--muted)}
    [data-theme="dark"] .foot{border-color:var(--dark-border)}
    .foot a{color:var(--populi);font-weight:600;text-decoration:none}
    .foot a:hover{text-decoration:underline}
    .loading{display:flex;align-items:center;justify-content:center;height:400px;font-size:.9rem;color:var(--muted)}
  </style>
</head>
<body>
<div class="wrap">
  <div class="sec-title"><span class="accent-bar"></span>IPP e IPM</div>
  <p class="sec-sub">Índice de Precios Productor y Precios al Por Mayor — Base 2016=100</p>

  <div id="kpis" class="kpi-grid"></div>

  <div class="main-grid">
    <div class="chart-card">
      <div class="chart-ctrl">
        <div class="tog-grp" id="toggles"></div>
        <div class="rng-grp" id="ranges"></div>
      </div>
      <div class="chart-area" id="chart"></div>
    </div>
    <div class="panel" id="panel">
      <div class="panel-title">Lectura del indicador</div>
      <div id="ctx" class="ctx-box">Cargando datos...</div>
      <div id="labels"></div>
      <a class="ampliar" href="https://centro-de-estudios-populi.github.io/populi-precios-productor/" target="_blank">
        Ampliar análisis →
      </a>
    </div>
  </div>

  <div class="edu-section" id="edu"></div>

  <div class="foot">
    <span>Fuente: <a href="https://www.ine.gob.bo" target="_blank">INE Bolivia</a> · Elaboración: <a href="https://populi.org.bo" target="_blank">POPULI</a></span>
    <span id="updated" style="font-family:'JetBrains Mono',monospace"></span>
  </div>
</div>

<div class="loading" id="loader">Cargando datos de precios productor...</div>

<script>
// Theme sync
const params = new URLSearchParams(location.search);
if (params.get('theme') === 'dark') document.documentElement.dataset.theme = 'dark';
window.addEventListener('message', e => { if (e.data && e.data.theme) document.documentElement.dataset.theme = e.data.theme });

(function(){
  const BASE = 'https://centro-de-estudios-populi.github.io/populi-precios-productor/data/';
  const C_IPP = '#2563EB', C_IPM = '#D97706';

  const VIEWS = [
    { key:'var_12_meses', label:'Var. interanual', fmt:v=>(v>=0?'+':'')+v.toFixed(1)+'%' },
    { key:'var_mensual', label:'Var. mensual', fmt:v=>(v>=0?'+':'')+v.toFixed(2)+'%' },
    { key:'indice', label:'Índice', fmt:v=>v.toFixed(1) },
  ];
  const RANGES = [
    { label:'2A', meses:24 },
    { label:'5A', meses:60 },
    { label:'Todo', meses:0 },
  ];

  let ipp=[], ipm=[], meta={}, chart, curView=0, curRange=0;

  async function init(){
    const [ippR,ipmR,metaR] = await Promise.all([
      fetch(BASE+'ipp_general.json').then(r=>r.json()),
      fetch(BASE+'ipm_general.json').then(r=>r.json()),
      fetch(BASE+'metadata.json').then(r=>r.json()),
    ]);
    ipp=ippR; ipm=ipmR; meta=metaR;
    document.getElementById('loader').style.display='none';
    document.querySelector('.wrap').style.display='block';

    // Updated timestamp
    if(meta.actualizado){
      const d=new Date(meta.actualizado);
      document.getElementById('updated').textContent='Act. '+d.toLocaleDateString('es-BO',{day:'numeric',month:'short',year:'numeric'});
    }

    buildKPIs();
    buildToggles();
    buildRanges();
    chart = echarts.init(document.getElementById('chart'));
    buildChart();
    updatePanel();
    window.addEventListener('resize',()=>chart&&chart.resize());
    new MutationObserver(()=>{buildChart();buildKPIs()}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

    buildEdu();
  }

  function fmtDate(f){
    const [y,m]=f.split('-');
    const mn=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
    return mn[+m-1]+' '+y;
  }

  function buildKPIs(){
    const lastIPP = ipp[ipp.length-1]||{};
    const prevIPP = ipp[ipp.length-2]||{};
    const lastIPM = ipm[ipm.length-1]||{};
    const prevIPM = ipm[ipm.length-2]||{};

    const deltaClass=(cur,prev)=>{
      if(cur==null||prev==null) return 'flat';
      return cur>prev?'up':cur<prev?'down':'flat';
    };
    const deltaIcon=(cls)=>cls==='up'?'▲':cls==='down'?'▼':'—';

    const kpis=[
      {s:'ipp',lbl:'IPP Interanual',val:lastIPP.var_12_meses!=null?(lastIPP.var_12_meses>=0?'+':'')+lastIPP.var_12_meses.toFixed(1)+'%':'—',
       d:lastIPP.var_12_meses!=null&&prevIPP.var_12_meses!=null?(lastIPP.var_12_meses-prevIPP.var_12_meses>=0?'+':'')+(lastIPP.var_12_meses-prevIPP.var_12_meses).toFixed(1)+' pp':'',
       cls:deltaClass(lastIPP.var_12_meses,prevIPP.var_12_meses)},
      {s:'ipm',lbl:'IPM Interanual',val:lastIPM.var_12_meses!=null?(lastIPM.var_12_meses>=0?'+':'')+lastIPM.var_12_meses.toFixed(1)+'%':'—',
       d:lastIPM.var_12_meses!=null&&prevIPM.var_12_meses!=null?(lastIPM.var_12_meses-prevIPM.var_12_meses>=0?'+':'')+(lastIPM.var_12_meses-prevIPM.var_12_meses).toFixed(1)+' pp':'',
       cls:deltaClass(lastIPM.var_12_meses,prevIPM.var_12_meses)},
      {s:'ipp',lbl:'IPP Índice',val:lastIPP.indice!=null?lastIPP.indice.toFixed(1):'—',
       d:lastIPP.fecha?fmtDate(lastIPP.fecha):'',cls:'flat'},
      {s:'ipm',lbl:'IPM Índice',val:lastIPM.indice!=null?lastIPM.indice.toFixed(1):'—',
       d:lastIPM.fecha?fmtDate(lastIPM.fecha):'',cls:'flat'},
    ];

    document.getElementById('kpis').innerHTML=kpis.map(k=>`
      <div class="kpi" data-s="${k.s}">
        <div class="kpi-lbl">${k.lbl}</div>
        <div class="kpi-val">${k.val}</div>
        ${k.d?`<span class="kpi-d ${k.cls}">${deltaIcon(k.cls)} ${k.d}</span>`:''}
      </div>`).join('');
  }

  function buildToggles(){
    document.getElementById('toggles').innerHTML=VIEWS.map((v,i)=>`
      <button class="pill${i===0?' act':''}" data-v="${i}"
        style="border-color:${i===0?C_IPP:'var(--border)'};color:${i===0?C_IPP:'var(--muted)'}">
        ${v.label}
      </button>`).join('');

    document.querySelectorAll('#toggles .pill').forEach(b=>{
      b.addEventListener('click',()=>{
        curView=+b.dataset.v;
        document.querySelectorAll('#toggles .pill').forEach((p,j)=>{
          p.classList.toggle('act',j===curView);
          p.style.borderColor=j===curView?C_IPP:'var(--border)';
          p.style.color=j===curView?C_IPP:'var(--muted)';
        });
        buildChart();
        updatePanel();
      });
    });
  }

  function buildRanges(){
    document.getElementById('ranges').innerHTML=RANGES.map((r,i)=>`
      <button class="rng${i===0?' act':''}" data-r="${i}">${r.label}</button>`).join('');
    document.querySelectorAll('#ranges .rng').forEach(b=>{
      b.addEventListener('click',()=>{
        curRange=+b.dataset.r;
        document.querySelectorAll('#ranges .rng').forEach((p,j)=>p.classList.toggle('act',j===curRange));
        buildChart();
      });
    });
  }

  function getSliced(arr){
    const m=RANGES[curRange].meses;
    return m?arr.slice(-m):arr;
  }

  function buildChart(){
    const d=document.documentElement.dataset.theme==='dark';
    const view=VIEWS[curView];
    const ippSlice=getSliced(ipp);
    const ipmSlice=getSliced(ipm);

    // Merge dates
    const allDates=new Set();
    ippSlice.forEach(r=>allDates.add(r.fecha));
    ipmSlice.forEach(r=>allDates.add(r.fecha));
    const dates=[...allDates].sort();

    const ippMap=Object.fromEntries(ippSlice.map(r=>[r.fecha,r]));
    const ipmMap=Object.fromEntries(ipmSlice.map(r=>[r.fecha,r]));

    const ippData=dates.map(f=>ippMap[f]?ippMap[f][view.key]:null);
    const ipmData=dates.map(f=>ipmMap[f]?ipmMap[f][view.key]:null);

    // X-axis label formatter
    const labels=dates.map((f,i)=>{
      if(i===0||i===dates.length-1) return fmtDate(f);
      const prevM=dates[i-1].split('-')[1];
      const curM=f.split('-')[1];
      if(curM!==prevM&&curM==='01') return f.split('-')[0];
      return '';
    });
    const step=Math.max(1,Math.round(dates.length/8));
    const xLabels=dates.map((f,i)=>{
      if(i===0||i===dates.length-1) return fmtDate(f);
      if(i%step===0) return fmtDate(f);
      return '';
    });

    const series=[
      {
        name:'IPP',type:'line',data:ippData,
        lineStyle:{width:2.5,color:C_IPP},itemStyle:{color:C_IPP},
        symbol:'none',smooth:0.15,
        areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:d?'rgba(37,99,235,.2)':'rgba(37,99,235,.08)'},{offset:1,color:'transparent'}])}
      },
      {
        name:'IPM',type:'line',data:ipmData,
        lineStyle:{width:2.5,color:C_IPM},itemStyle:{color:C_IPM},
        symbol:'none',smooth:0.15,
      },
    ];

    // Reference line at 0 for var views
    const isVar=view.key.startsWith('var');
    const markLine=isVar?{
      data:[{yAxis:0,lineStyle:{color:d?'#475569':'#CBD5E1',type:'solid',width:1},label:{show:false}}],
      symbol:'none',silent:true
    }:undefined;
    if(markLine) series[0].markLine=markLine;

    chart.setOption({
      tooltip:{
        trigger:'axis',backgroundColor:d?'#1E293B':'#fff',borderColor:d?'#334155':'#E2E8F0',
        textStyle:{color:d?'#E2E8F0':'#1E293B',fontFamily:'Inter',fontSize:12},
        formatter:params=>{
          const f=dates[params[0].dataIndex];
          let h=`<div style="font-weight:700;margin-bottom:4px">${fmtDate(f)}</div>`;
          params.forEach(p=>{
            if(p.value!=null) h+=`<div style="display:flex;align-items:center;gap:6px"><span style="width:8px;height:8px;border-radius:50%;background:${p.color}"></span><span>${p.seriesName}:</span><strong>${view.fmt(p.value)}</strong></div>`;
          });
          return h;
        }
      },
      grid:{left:55,right:20,top:20,bottom:35},
      xAxis:{
        type:'category',data:dates,
        axisLine:{lineStyle:{color:d?'#1E1E1E':'#E2E8F0'}},
        axisTick:{show:false},
        axisLabel:{fontFamily:'JetBrains Mono',fontSize:10,color:d?'#64748B':'#94A3B8',
          formatter:(v,i)=>xLabels[i]||''}
      },
      yAxis:{
        type:'value',
        splitLine:{lineStyle:{color:d?'#1E1E1E':'#F1F5F9',type:'dashed'}},
        axisLine:{show:false},axisTick:{show:false},
        axisLabel:{fontFamily:'JetBrains Mono',fontSize:11,color:d?'#64748B':'#94A3B8',
          formatter:v=>isVar?(v>=0?'+':'')+v.toFixed(0)+'%':v.toFixed(0)}
      },
      series:series
    },true);
  }

  function updatePanel(){
    const view=VIEWS[curView];
    const lastIPP=ipp[ipp.length-1]||{};
    const lastIPM=ipm[ipm.length-1]||{};
    const ippV=lastIPP[view.key];
    const ipmV=lastIPM[view.key];

    // Labels
    const labelsHTML=[
      {name:'IPP — Precios Productor',color:C_IPP,val:ippV!=null?view.fmt(ippV):'—',date:lastIPP.fecha},
      {name:'IPM — Precios al Por Mayor',color:C_IPM,val:ipmV!=null?view.fmt(ipmV):'—',date:lastIPM.fecha},
    ].map(l=>`
      <div class="lbl-row">
        <span class="lbl-color" style="background:${l.color}"></span>
        <span class="lbl-name">${l.name}</span>
        <span class="lbl-val">${l.val}</span>
      </div>`).join('');
    document.getElementById('labels').innerHTML=labelsHTML;

    // Context box
    let ctx='';
    if(view.key==='var_12_meses'&&ippV!=null&&ipmV!=null){
      const diff=Math.abs(ippV-ipmV).toFixed(1);
      const higher=ippV>ipmV?'IPP':'IPM';
      const lower=ippV>ipmV?'IPM':'IPP';

      if(ippV>20||ipmV>20){
        ctx=`<strong>Presiones inflacionarias severas en la cadena productiva.</strong> Con el ${higher} en ${Math.max(ippV,ipmV).toFixed(1)}%, los precios al inicio de la cadena anticipan una inflación al consumidor persistente. La brecha entre IPP e IPM es de ${diff} pp — ${ippV>ipmV?'los productores enfrentan costos que aún no se trasladan completamente al canal mayorista':'los precios mayoristas reflejan presiones adicionales del tipo de cambio en bienes importados'}.`;
      } else if(ippV>10||ipmV>10){
        ctx=`<strong>Presiones significativas en precios de producción y distribución.</strong> El ${higher} (+${Math.max(ippV,ipmV).toFixed(1)}%) lidera las alzas con ${diff} pp sobre el ${lower}. Estas presiones se trasladan con rezago al IPC — el consumidor las sentirá en los próximos meses.`;
      } else if(ippV>4||ipmV>4){
        ctx=`<strong>Presiones moderadas.</strong> Tanto IPP (+${ippV.toFixed(1)}%) como IPM (+${ipmV.toFixed(1)}%) muestran variaciones por encima del rango de estabilidad. La diferencia de ${diff} pp indica ${ippV>ipmV?'que el canal mayorista absorbe parte del impacto':'que los márgenes de distribución amplifican el alza'}.`;
      } else {
        ctx=`<strong>Estabilidad relativa en precios productores y mayoristas.</strong> IPP en +${ippV.toFixed(1)}% e IPM en +${ipmV.toFixed(1)}% sugieren presiones contenidas a lo largo de la cadena de precios.`;
      }
    } else if(view.key==='var_mensual'){
      const v=ippV!=null?ippV:ipmV;
      ctx=v!=null?`La variación mensual muestra el cambio de precios respecto al mes anterior. ${v>1?'Una variación superior al 1% mensual es inusual e indica un shock de precios en la cadena productiva.':v>0?'Variación positiva moderada — las presiones se acumulan mes a mes.':'Variación negativa — alivio temporal en costos de producción, posiblemente estacional.'}`:'Datos no disponibles para este período.';
    } else {
      ctx=`El índice base 2016=100 muestra cuánto han cambiado los precios respecto al año de referencia. Un valor de ${ippV!=null?ippV.toFixed(0):'—'} implica un aumento acumulado de ${ippV!=null?(ippV-100).toFixed(0):'—'}% desde 2016 en precios al productor.`;
    }
    document.getElementById('ctx').innerHTML=ctx;
  }

  function buildEdu(){
    document.getElementById('edu').innerHTML=[
      {
        title:'¿Qué son el IPP y el IPM?',
        content:`<p>El <strong>Índice de Precios Productor (IPP)</strong> mide la variación de precios a la salida del lugar de producción — fábrica, campo, mina. Es el primer eslabón de la cadena de precios: cuando sube, anticipa presiones que eventualmente llegarán al consumidor.</p>
        <p>El <strong>Índice de Precios al Por Mayor (IPM)</strong> mide los precios en el canal mayorista, donde los bienes pasan del productor o importador al minorista. Incluye tanto bienes de <strong>origen nacional</strong> como <strong>importados</strong>, lo que lo hace sensible a las variaciones del tipo de cambio.</p>`
      },
      {
        title:'¿Cómo se relacionan IPP, IPM e IPC?',
        content:`<p>Los tres índices miden precios en diferentes etapas de la cadena: <strong>IPP → IPM → IPC</strong> (productor → mayorista → consumidor). Las presiones de precios suelen nacer en el IPP, transmitirse al IPM con semanas de rezago, y finalmente llegar al IPC.</p>
        <p>Cuando el IPP sube más que el IPM, los intermediarios absorben parte del costo. Cuando el IPM sube más que el IPP, la brecha cambiaria encarece los <strong>insumos importados</strong>, añadiendo presión en la etapa de distribución. Monitorear los tres permite anticipar la inflación al consumidor antes de que se materialice.</p>`
      },
      {
        title:'El canal importado y el tipo de cambio',
        content:`<p>El IPM distingue entre bienes de <strong>origen nacional</strong> e <strong>importados</strong>. En un contexto de brecha cambiaria como el de Bolivia, los bienes importados reflejan el tipo de cambio paralelo, no el oficial de 6.96 Bs/$. Esto genera una <strong>inflación importada</strong> que se amplifica cuando el boliviano se deprecia de facto.</p>
        <p>Los sectores más expuestos son la industria manufacturera (insumos importados) y los alimentos procesados. Esta distinción permite evaluar cuánto de la inflación se origina internamente y cuánto se "importa" vía tipo de cambio.</p>`
      }
    ].map(e=>`<div class="edu" onclick="this.classList.toggle('open')"><div class="edu-tog"><span class="edu-t">${e.title}</span><span class="edu-arr">&#9660;</span></div><div class="edu-c">${e.content}</div></div>`).join('');
  }

  // Hide wrap until loaded
  document.querySelector('.wrap').style.display='none';
  init();
})();
</script>
