<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IPP e IPM · Populi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <style>
    /* ── Variables — Tema Claro (Populi Website) ─────────────────── */
    :root {
      --populi:       #C71E1D;
      --populi-dark:  #6B0300;
      --populi-light: #E8706B;
      --populi-gold:  #EE9B00;
      --cream:        #F5EFE0;
      --brown:        #5C3D1E;
      --brown-dark:   #3D2B1F;
      --navy:         #0D1B2A;
      --navy-light:   #1A2940;
      --slate:        #475569;
      --slate-light:  #64748B;
      --warm-white:   #FAF8F3;
      --light-gray:   #F1EDE5;
      --border:       #E2DDD3;
      --dark-border:  #2A3A50;

      --bg:   var(--warm-white);
      --card: #FFFFFF;
      --text: var(--brown-dark);
      --text2: var(--slate);
      --muted: var(--slate-light);

      --ct-ipp:  #005F73;
      --ct-ipm:  #EE9B00;
      --ct-nac:  #0A9396;
      --ct-imp:  #C71E1D;

      --shadow: 0 1px 3px rgba(13,27,42,.04), 0 4px 16px rgba(13,27,42,.06);
      --radius: 12px;
    }

    /* ── Variables — Tema Oscuro ──────────────────────────────────── */
    [data-theme="dark"] {
      --bg:          #080808;
      --card:        #141414;
      --text:        #E2E8F0;
      --text2:       #64748B;
      --muted:       #64748B;
      --border:      #2A3A50;
      --light-gray:  #1A1A1A;
      --cream:       #1A2940;
      --shadow: 0 2px 8px rgba(0,0,0,.5), 0 6px 24px rgba(0,0,0,.4);
    }

    /* ── Reset ────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      padding: 0;
      margin: 0;
      transition: background .25s ease, color .25s ease;
    }

    .embed-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 16px;
    }

    /* ── Section Header ──────────────────────────────────────────── */
    .section-header {
      margin-bottom: 16px;
    }
    .section-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.55rem;
      font-weight: 700;
      color: var(--navy);
      display: flex;
      align-items: center;
      gap: 10px;
      line-height: 1.15;
    }
    [data-theme="dark"] .section-title { color: #fff; }
    .section-title .accent-bar {
      width: 4px;
      height: 26px;
      background: var(--ct-ipp);
      border-radius: 2px;
      flex-shrink: 0;
    }
    .section-subtitle {
      font-size: 0.78rem;
      color: var(--muted);
      padding-left: 14px;
      margin-top: 2px;
    }
    [data-theme="dark"] .section-subtitle { color: rgba(255,255,255,.4); }

    /* ── KPI Strip ───────────────────────────────────────────────── */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    @media (max-width: 700px) {
      .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    }
    .kpi-card {
      background: var(--warm-white);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      position: relative;
      overflow: hidden;
      cursor: default;
      transition: transform .2s, box-shadow .2s;
    }
    [data-theme="dark"] .kpi-card {
      background: #141414;
      border-color: var(--dark-border);
    }
    .kpi-card:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(0,0,0,.08);
    }
    .kpi-card::after {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 3px;
    }
    .kpi-card[data-s="ipp"]::after  { background: var(--ct-ipp); }
    .kpi-card[data-s="ipm"]::after  { background: var(--ct-ipm); }
    .kpi-card[data-s="nac"]::after  { background: var(--ct-nac); }
    .kpi-card[data-s="imp"]::after  { background: var(--ct-imp); }
    .kpi-label {
      font-size: 0.62rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 4px;
    }
    [data-theme="dark"] .kpi-label { color: rgba(255,255,255,.4); }
    .kpi-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.25rem;
      font-weight: 700;
    }
    .kpi-delta {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      font-weight: 600;
      padding: 1px 7px;
      border-radius: 5px;
      margin-top: 5px;
    }
    .kpi-delta.up { background: rgba(199,30,29,.08); color: #C71E1D; }
    .kpi-delta.down { background: rgba(10,147,150,.08); color: #0A9396; }
    .kpi-delta.flat { background: rgba(100,116,139,.08); color: #64748B; }
    [data-theme="dark"] .kpi-delta.up { background: rgba(199,30,29,.15); }
    [data-theme="dark"] .kpi-delta.down { background: rgba(10,147,150,.15); }

    /* ── Main Grid: Chart + Panel ────────────────────────────────── */
    .main-grid {
      display: grid;
      grid-template-columns: 3fr 2fr;
      grid-template-rows: 540px;
      gap: 16px;
    }
    @media (max-width: 900px) {
      .main-grid { grid-template-columns: 1fr; grid-template-rows: 420px auto; }
    }
    @media (max-width: 500px) {
      .main-grid { grid-template-rows: 340px auto; }
      .section-title { font-size: 1.2rem; }
      .section-subtitle { font-size: .7rem; }
      .kpi-value { font-size: 1rem; }
      .toggle-pill { padding: 3px 8px; font-size: .6rem; }
      .range-btn { padding: 4px 10px; font-size: .6rem; }
    }
    @media (min-width: 1100px) {
      .main-grid { grid-template-rows: 580px; }
    }

    /* ── Chart Card ──────────────────────────────────────────────── */
    .chart-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }
    [data-theme="dark"] .chart-card {
      background: #141414;
      border-color: var(--dark-border);
    }
    .chart-controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .toggle-group { display: flex; gap: 6px; flex-wrap: wrap; }

    .toggle-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 4px 12px;
      border: 1.5px solid;
      border-radius: 8px;
      background: transparent;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      transition: all .2s;
    }
    .toggle-pill:hover {
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }
    .toggle-pill .line-prev {
      width: 16px; height: 0;
      border-top: 2.5px solid;
      border-radius: 1px;
    }
    .toggle-pill .line-prev.dashed { border-top-style: dashed; }

    .controls-right {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    .controls-divider {
      width: 1px;
      height: 18px;
      background: var(--border);
    }
    [data-theme="dark"] .controls-divider { background: var(--dark-border); }

    .range-group { display: flex; gap: 4px; }
    .range-btn {
      padding: 4px 10px;
      border: 1.5px solid var(--border);
      border-radius: 7px;
      background: transparent;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-size: 0.65rem;
      font-weight: 600;
      color: var(--muted);
      transition: all .2s;
    }
    [data-theme="dark"] .range-btn { border-color: var(--dark-border); color: #64748B; }
    .range-btn:hover, .range-btn.active {
      border-color: var(--populi);
      color: var(--populi);
    }
    [data-theme="dark"] .range-btn:hover, [data-theme="dark"] .range-btn.active {
      border-color: var(--populi-light);
      color: var(--populi-light);
    }

    .chart-area {
      flex: 1;
      min-height: 0;
    }

    .chart-source {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 8px;
      padding: 0 2px;
    }
    .chart-source-text {
      font-size: 0.58rem;
      color: var(--muted);
      opacity: .6;
    }
    .chart-source-text a {
      color: var(--populi);
      font-weight: 600;
      text-decoration: none;
    }
    .chart-source-text a:hover { text-decoration: underline; }

    /* ── Panel ────────────────────────────────────────────────────── */
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    [data-theme="dark"] .panel {
      background: #141414;
      border-color: var(--dark-border);
    }
    .panel-header {
      background: var(--navy);
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    [data-theme="dark"] .panel-header { background: var(--navy-light); }
    .panel-header-title {
      font-size: 0.56rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: rgba(255,255,255,.8);
    }
    .panel-header-date {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.56rem;
      font-weight: 600;
      color: var(--populi-light);
      background: rgba(199,30,29,.15);
      padding: 2px 8px;
      border-radius: 5px;
    }
    .panel-body {
      padding: 14px;
      flex: 1;
      overflow-y: auto;
    }
    .panel-block {
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    [data-theme="dark"] .panel-block { border-color: var(--dark-border); }
    .panel-block:last-of-type { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .panel-label {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.58rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 2px;
      padding: 2px 9px 2px 6px;
      border-radius: 4px;
      border-left: 3px solid;
    }
    .panel-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.92rem;
      font-weight: 700;
      margin-bottom: 3px;
    }
    .panel-desc {
      font-size: 0.66rem;
      line-height: 1.55;
      color: var(--slate-light);
    }
    [data-theme="dark"] .panel-desc { color: rgba(255,255,255,.45); }
    .panel-desc strong { color: var(--navy); }
    [data-theme="dark"] .panel-desc strong { color: #E2E8F0; }

    .delta-tag {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 0.82em;
      white-space: nowrap;
    }
    .dt-blue   { background: rgba(0,95,115,.08);  color: #005F73; }
    .dt-amber  { background: rgba(238,155,0,.08);  color: #EE9B00; }
    .dt-teal   { background: rgba(10,147,150,.08);  color: #0A9396; }
    .dt-red    { background: rgba(199,30,29,.08);  color: #C71E1D; }

    /* ── Context Analysis ─────────────────────────────────────────── */
    .ctx-box {
      background: var(--cream);
      border-radius: 6px;
      padding: 8px 10px;
      border-left: 3px solid var(--populi);
      margin-top: 6px;
    }
    [data-theme="dark"] .ctx-box { background: var(--navy-light); }
    .ctx-box p {
      font-size: 0.66rem;
      line-height: 1.55;
      color: var(--slate-light);
    }
    [data-theme="dark"] .ctx-box p { color: #64748B; }
    .ctx-box p strong { color: var(--navy); }
    [data-theme="dark"] .ctx-box p strong { color: #E2E8F0; }

    /* ── Edu Boxes ────────────────────────────────────────────────── */
    .edu-box {
      background: var(--cream);
      border-radius: 8px;
      padding: 10px 12px;
      border-left: 3px solid var(--populi);
      margin-top: 4px;
      cursor: pointer;
      transition: all .2s;
    }
    [data-theme="dark"] .edu-box { background: var(--navy-light); }
    .edu-box:hover { transform: translateY(-1px); }
    .edu-box-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .edu-box-title {
      font-size: 0.62rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--populi);
    }
    [data-theme="dark"] .edu-box-title { color: var(--populi-light); }
    .edu-box-arrow {
      font-size: 0.6rem;
      color: var(--muted);
      transition: transform .2s;
    }
    .edu-box.open .edu-box-arrow { transform: rotate(180deg); }
    .edu-box-content {
      display: none;
      margin-top: 8px;
    }
    .edu-box.open .edu-box-content { display: block; }
    .edu-box-content p {
      font-size: 0.66rem;
      line-height: 1.6;
      color: var(--slate-light);
      margin-bottom: 6px;
    }
    .edu-box-content p:last-child { margin-bottom: 0; }
    [data-theme="dark"] .edu-box-content p { color: #64748B; }
    .edu-box-content p strong { color: var(--navy); }
    [data-theme="dark"] .edu-box-content p strong { color: #E2E8F0; }
    .edu-box-content .highlight {
      display: inline;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.92em;
      font-weight: 600;
      padding: 0 4px;
      border-radius: 3px;
    }
    .hl-blue   { background: rgba(0,95,115,.08);  color: #005F73; }
    .hl-amber  { background: rgba(238,155,0,.08);  color: #EE9B00; }
    .hl-teal   { background: rgba(10,147,150,.08);  color: #0A9396; }
    .hl-red    { background: rgba(199,30,29,.08);  color: #C71E1D; }

    /* ── Ampliar Button ──────────────────────────────────────────── */
    .panel-footer {
      padding: 10px 14px;
      border-top: 1px solid var(--border);
    }
    [data-theme="dark"] .panel-footer { border-color: var(--dark-border); }
    .ampliar-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 8px 0;
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 0.66rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--populi);
      background: rgba(199,30,29,.06);
      border: 1.5px solid rgba(199,30,29,.15);
      transition: all .2s;
      text-decoration: none;
      cursor: pointer;
    }
    [data-theme="dark"] .ampliar-btn {
      background: rgba(232,112,107,.08);
      border-color: rgba(232,112,107,.2);
      color: var(--populi-light);
    }
    .ampliar-btn:hover {
      background: rgba(199,30,29,.12);
      border-color: rgba(199,30,29,.3);
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(199,30,29,.1);
      text-decoration: none;
    }
    .ampliar-btn svg {
      width: 13px; height: 13px;
    }

    /* ── Watermark ────────────────────────────────────────────────── */
    .watermark {
      height: 15px;
      width: auto;
      opacity: .18;
    }
    [data-theme="dark"] .watermark { opacity: .10; }

    /* ── Loading ──────────────────────────────────────────────────── */
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 400px;
      color: var(--muted);
    }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--populi);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 0.75rem; }
  </style>
</head>
<body>
  <div class="embed-container" id="app">
    <div class="loading" id="loader">
      <div class="spinner"></div>
      <span class="loading-text">Cargando datos de precios productor y mayorista...</span>
    </div>
  </div>

  <script>
  (function() {
    const BASE = 'https://centro-de-estudios-populi.github.io/populi-precios-productor/data/';
    const DASHBOARD_URL = 'https://centro-de-estudios-populi.github.io/populi-precios-productor/';

    const params = new URLSearchParams(window.location.search);
    if (params.get('theme') === 'dark') document.documentElement.dataset.theme = 'dark';

    window.addEventListener('message', e => {
      if (e.data && e.data.theme) document.documentElement.dataset.theme = e.data.theme;
    });

    function isDark() { return document.documentElement.dataset.theme === 'dark'; }
    function fpct(v) { return (v >= 0 ? '+' : '') + v.toFixed(1) + '%'; }
    function fdate(f) {
      const [y, m] = f.split('-');
      const mn = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
      return mn[+m - 1] + ' ' + y;
    }

    const SERIES_CFG = [
      { key: 'ipp',  label: 'IPP',          color: '#005F73', dashed: false },
      { key: 'ipm',  label: 'IPM General',   color: '#EE9B00', dashed: false },
      { key: 'nac',  label: 'IPM Nacional',   color: '#0A9396', dashed: true },
      { key: 'imp',  label: 'IPM Importado',  color: '#C71E1D', dashed: true },
    ];

    const VIEWS = [
      { key: 'var_12_meses', label: 'Interanual', fmt: v => (v >= 0 ? '+' : '') + v.toFixed(1) + '%', yFmt: v => (v >= 0 ? '+' : '') + v.toFixed(0) + '%', isVar: true },
      { key: 'var_mensual',  label: 'Mensual',    fmt: v => (v >= 0 ? '+' : '') + v.toFixed(2) + '%', yFmt: v => (v >= 0 ? '+' : '') + v.toFixed(1) + '%', isVar: true },
      { key: 'var_acumulada', label: 'Acumulada',   fmt: v => (v >= 0 ? '+' : '') + v.toFixed(1) + '%', yFmt: v => (v >= 0 ? '+' : '') + v.toFixed(0) + '%', isVar: true },
    ];

    const RANGES = [
      { label: '2A', meses: 24 },
      { label: '5A', meses: 60 },
      { label: 'Todo', meses: 0 },
    ];

    let ippData = [], ipmGen = [], ipmNac = [], ipmImp = [];
    let active = new Set(SERIES_CFG.map(s => s.key));
    let curView = 0, curRange = 0;
    let chart = null, curIdx = -1;

    async function init() {
      let ippRaw, origenRaw, metaRaw;
      try {
        [ippRaw, origenRaw, metaRaw] = await Promise.all([
          fetch(BASE + 'ipp_general.json').then(r => r.json()),
          fetch(BASE + 'ipm_origen.json').then(r => r.json()),
          fetch(BASE + 'metadata.json').then(r => r.json()),
        ]);
      } catch(e) {
        document.getElementById('loader').innerHTML =
          '<span class="loading-text" style="color:var(--ct-imp)">Error al cargar datos. Intente recargar.</span>';
        return;
      }

      ippData = ippRaw;
      const origenMap = {};
      origenRaw.forEach(cat => { origenMap[cat.categoria] = cat.series; });
      ipmGen = origenMap['GENERAL'] || [];
      ipmNac = origenMap['ORIGEN NACIONAL'] || [];
      ipmImp = origenMap['ORIGEN IMPORTADOS'] || [];

      const allSeries = { ipp: ippData, ipm: ipmGen, nac: ipmNac, imp: ipmImp };

      const app = document.getElementById('app');
      app.innerHTML = buildHTML(metaRaw);

      buildKPIs(allSeries);
      buildToggles();
      buildViews();
      buildRanges();

      chart = echarts.init(document.getElementById('chart'));
      buildChart(allSeries);
      updatePanel(allSeries, getLastCommonIdx(allSeries));

      window.addEventListener('resize', () => chart && chart.resize());

      new MutationObserver(() => {
        buildChart(allSeries);
        updatePanel(allSeries, curIdx);
        buildKPIs(allSeries);
      }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
    }

    function buildHTML(meta) {
      const dk = isDark();
      const updTxt = meta.actualizado
        ? new Date(meta.actualizado).toLocaleDateString('es-BO', { day:'numeric', month:'short', year:'numeric' })
        : '';

      return `
        <div class="section-header">
          <h2 class="section-title">
            <span class="accent-bar"></span>
            Precios Productor y Mayorista
          </h2>
          <p class="section-subtitle">IPP e IPM — Base 2016=100 · Serie mensual${updTxt ? ' · Act. ' + updTxt : ''}</p>
        </div>

        <div class="kpi-grid" id="kpis"></div>

        <div class="main-grid">
          <div class="chart-card">
            <div class="chart-controls">
              <div class="toggle-group" id="toggles"></div>
              <div class="controls-right">
                <div class="range-group" id="views"></div>
                <div class="controls-divider"></div>
                <div class="range-group" id="ranges"></div>
              </div>
            </div>
            <div class="chart-area" id="chart"></div>
            <div class="chart-source">
              <span class="chart-source-text">
                Fuente: <a href="https://www.ine.gob.bo" target="_blank">INE Bolivia</a> ·
                Elaboración: <a href="https://populi.org.bo" target="_blank">Centro de Estudios POPULI</a>
              </span>
              <svg viewBox="0 0 310 130" xmlns="http://www.w3.org/2000/svg" class="watermark">
                <text x="6" y="112" font-family="'Playfair Display', Georgia, serif" font-size="145" font-weight="700" fill="${dk ? '#E8706B' : '#C71E1D'}">P</text>
                <text x="92" y="87" font-family="'Playfair Display', Georgia, serif" font-size="55" font-weight="400" font-style="italic" letter-spacing="1" fill="${dk ? '#F5EFE0' : '#3D2B1F'}">opuli</text>
              </svg>
            </div>
          </div>

          <div class="panel">
            <div class="panel-header">
              <span class="panel-header-title">Lectura del indicador</span>
              <span class="panel-header-date" id="panel-date"></span>
            </div>
            <div class="panel-body" id="panel-body"></div>
            <div class="panel-footer">
              <a href="${DASHBOARD_URL}" target="_blank" class="ampliar-btn">
                <span>Ampliar análisis</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                  <polyline points="15 3 21 3 21 9"/>
                  <line x1="10" y1="14" x2="21" y2="3"/>
                </svg>
              </a>
            </div>
          </div>
        </div>

        <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap:10px; margin-top:16px;" id="edu-boxes"></div>
      `;
    }

    function buildKPIs(allSeries) {
      const view = VIEWS[curView];
      const kpis = SERIES_CFG.map(s => {
        const arr = allSeries[s.key];
        const last = arr[arr.length - 1] || {};
        const prev = arr[arr.length - 2] || {};
        const val = last[view.key];
        const prevVal = prev[view.key];
        const d = (val != null && prevVal != null) ? val - prevVal : 0;
        const cls = Math.abs(d) < 0.01 ? 'flat' : (d > 0 ? 'up' : 'down');
        const arrow = cls === 'up' ? '&#9650;' : cls === 'down' ? '&#9660;' : '&#8212;';
        return `<div class="kpi-card" data-s="${s.key === 'ipm' ? 'ipm' : s.key === 'nac' ? 'nac' : s.key === 'imp' ? 'imp' : 'ipp'}">
          <div class="kpi-label">${s.label}</div>
          <div class="kpi-value" style="color:${s.color}">${val != null ? view.fmt(val) : '—'}</div>
          <div class="kpi-delta ${cls}">${arrow} ${Math.abs(d).toFixed(1)} pp</div>
        </div>`;
      });
      document.getElementById('kpis').innerHTML = kpis.join('');
    }

    function buildToggles() {
      const el = document.getElementById('toggles');
      SERIES_CFG.forEach(s => {
        const btn = document.createElement('button');
        btn.className = 'toggle-pill';
        btn.dataset.key = s.key;
        btn.innerHTML = `<span class="line-prev${s.dashed ? ' dashed' : ''}" style="border-color:#fff"></span>${s.label}`;
        btn.addEventListener('click', () => {
          if (active.has(s.key)) {
            if (active.size === 1) return;
            active.delete(s.key);
          } else {
            active.add(s.key);
          }
          syncPills();
          rebuildAll();
        });
        el.appendChild(btn);
      });
      syncPills();
    }

    function syncPills() {
      document.querySelectorAll('.toggle-pill').forEach(btn => {
        const s = SERIES_CFG.find(x => x.key === btn.dataset.key);
        const on = active.has(s.key);
        btn.style.backgroundColor = on ? s.color : 'transparent';
        btn.style.color = on ? '#fff' : s.color;
        btn.style.borderColor = s.color;
        const line = btn.querySelector('.line-prev');
        if (line) line.style.borderColor = on ? '#fff' : s.color;
      });
    }

    function buildViews() {
      const el = document.getElementById('views');
      VIEWS.forEach((v, i) => {
        const btn = document.createElement('button');
        btn.className = 'range-btn' + (i === 0 ? ' active' : '');
        btn.textContent = v.label;
        btn.addEventListener('click', () => {
          curView = i;
          document.querySelectorAll('#views .range-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          rebuildAll();
        });
        el.appendChild(btn);
      });
    }

    function buildRanges() {
      const el = document.getElementById('ranges');
      RANGES.forEach((r, i) => {
        const btn = document.createElement('button');
        btn.className = 'range-btn' + (i === RANGES.length - 1 ? ' active' : '');
        btn.textContent = r.label;
        btn.addEventListener('click', () => {
          curRange = i;
          document.querySelectorAll('#ranges .range-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          rebuildAll();
        });
        el.appendChild(btn);
      });
    }

    function rebuildAll() {
      const allSeries = { ipp: ippData, ipm: ipmGen, nac: ipmNac, imp: ipmImp };
      buildChart(allSeries);
      buildKPIs(allSeries);
      updatePanel(allSeries, curIdx);
    }

    function getLastCommonIdx(allSeries) {
      const allDates = mergedDates(allSeries, 0);
      return allDates.length - 1;
    }

    function mergedDates(allSeries, rangeIdx) {
      const meses = RANGES[rangeIdx].meses;
      const dateSet = new Set();
      SERIES_CFG.forEach(s => {
        if (!active.has(s.key)) return;
        const arr = allSeries[s.key];
        const sliced = meses > 0 ? arr.slice(-meses) : arr;
        sliced.forEach(r => dateSet.add(r.fecha));
      });
      return [...dateSet].sort();
    }

    function buildChart(allSeries) {
      const container = document.getElementById('chart');
      if (!chart) chart = echarts.init(container);

      const dk = isDark();
      const view = VIEWS[curView];
      const meses = RANGES[curRange].meses;
      const dates = mergedDates(allSeries, curRange);
      if (dates.length === 0) return;

      const seriesEch = [];
      const colors = [];

      SERIES_CFG.forEach(s => {
        if (!active.has(s.key)) return;
        colors.push(s.color);
        const arr = allSeries[s.key];
        const map = Object.fromEntries(arr.map(r => [r.fecha, r]));
        const vals = dates.map(f => map[f] ? map[f][view.key] : null);

        const lastValid = vals.filter(v => v != null).pop();
        const lastIdx = vals.lastIndexOf(lastValid);

        seriesEch.push({
          name: s.label,
          type: 'line',
          data: vals,
          symbol: 'none',
          smooth: 0.15,
          lineStyle: { width: 2.5, type: s.dashed ? [6, 4] : 'solid' },
          connectNulls: true,
          areaStyle: (s.key === 'ipp' || s.key === 'ipm') ? {
            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
              { offset: 0, color: s.key === 'ipp'
                ? (dk ? 'rgba(0,95,115,.2)' : 'rgba(0,95,115,.1)')
                : (dk ? 'rgba(238,155,0,.15)' : 'rgba(238,155,0,.08)') },
              { offset: 1, color: 'transparent' }
            ])
          } : undefined,
          markPoint: lastIdx >= 0 ? {
            data: [{ coord: [lastIdx, lastValid] }],
            symbol: 'circle', symbolSize: 7,
            itemStyle: { color: s.color, borderColor: dk ? '#141414' : '#fff', borderWidth: 2 },
            label: { show: false }
          } : undefined,
          z: s.key === 'ipp' ? 4 : s.key === 'ipm' ? 3 : 2
        });
      });

      if (view.isVar) {
        seriesEch.push({
          name: 'Ref 0%',
          type: 'line',
          data: dates.map(() => 0),
          symbol: 'none',
          lineStyle: { width: 1.5, color: dk ? '#475569' : '#E2DDD3', type: [5, 4] },
          itemStyle: { color: dk ? '#475569' : '#E2DDD3' },
          z: 1
        });
      }

      const option = {
        color: colors,
        backgroundColor: 'transparent',
        grid: { top: 30, right: 16, bottom: 44, left: 52 },
        tooltip: {
          trigger: 'axis',
          backgroundColor: dk ? '#080808' : 'rgba(13,27,42,.96)',
          borderColor: dk ? '#2A3A50' : '#1A2940',
          textStyle: { fontFamily: 'Inter', fontSize: 12, color: '#fff' },
          padding: [12, 16],
          extraCssText: 'border-radius:10px; box-shadow:0 8px 32px rgba(0,0,0,.3);',
          formatter: function(params) {
            if (!params.length) return '';
            const idx = params[0].dataIndex;
            updatePanel({ ipp: ippData, ipm: ipmGen, nac: ipmNac, imp: ipmImp }, idx, dates);

            let html = `<div style="font-weight:700; margin-bottom:6px; color:#E9D8A6; font-size:12px">${fdate(dates[idx])}</div>`;
            params.forEach(p => {
              if (p.value == null || p.seriesName === 'Ref 0%') return;
              html += `<div style="display:flex; align-items:center; gap:8px; margin:3px 0">
                <span style="width:8px;height:8px;border-radius:50%;background:${p.color};display:inline-block"></span>
                <span style="flex:1;font-size:11px;color:rgba(255,255,255,.7)">${p.seriesName}</span>
                <span style="font-family:'JetBrains Mono';font-weight:700;font-size:12px">${view.fmt(p.value)}</span>
              </div>`;
            });
            return html;
          }
        },
        xAxis: {
          type: 'category',
          data: dates,
          axisLine: { lineStyle: { color: dk ? '#2A3A50' : '#E2DDD3' } },
          axisTick: { show: false },
          axisLabel: {
            fontFamily: 'Inter',
            fontSize: 10,
            fontWeight: 500,
            color: dk ? '#64748B' : '#64748B',
            formatter: function(v, idx) {
              const total = dates.length;
              if (idx === 0 || idx === total - 1) return fdate(v);
              const step = Math.max(1, Math.round(total / 8));
              if (idx % step === 0) return fdate(v);
              return '';
            },
            showMinLabel: true,
            showMaxLabel: true,
          }
        },
        yAxis: {
          type: 'value',
          splitLine: { lineStyle: { color: dk ? '#141414' : '#F1F5F9', type: 'dashed' } },
          axisLine: { show: false },
          axisTick: { show: false },
          axisLabel: {
            fontFamily: 'JetBrains Mono',
            fontSize: 11,
            color: dk ? '#64748B' : '#64748B',
            formatter: v => view.yFmt(v)
          }
        },
        series: seriesEch
      };

      chart.setOption(option, true);
    }

    function updatePanel(allSeries, dateIdx, datesArr) {
      const view = VIEWS[curView];
      let dates = datesArr;
      if (!dates) {
        dates = mergedDates(allSeries, curRange);
      }
      if (dateIdx < 0 || dateIdx >= dates.length) dateIdx = dates.length - 1;
      curIdx = dateIdx;
      const fecha = dates[dateIdx];
      const prevFecha = dateIdx > 0 ? dates[dateIdx - 1] : null;

      document.getElementById('panel-date').textContent = fdate(fecha);

      const getVal = (arr, f, key) => {
        const r = arr.find(x => x.fecha === f);
        return r ? r[key] : null;
      };

      const blocks = [];
      const dtClasses = { ipp: 'dt-blue', ipm: 'dt-amber', nac: 'dt-teal', imp: 'dt-red' };
      const bgAlpha  = { ipp: 'rgba(0,95,115,.08)', ipm: 'rgba(238,155,0,.08)', nac: 'rgba(10,147,150,.08)', imp: 'rgba(199,30,29,.08)' };
      const labels   = { ipp: 'IPP — Productor', ipm: 'IPM — General', nac: 'IPM — Nacional', imp: 'IPM — Importado' };
      const descs    = {
        ipp: 'Variación de precios a la <strong>salida de producción</strong> (fábricas, campos, minas). Primer eslabón de la cadena de precios.',
        ipm: 'Variación de precios en el <strong>canal mayorista</strong>, incluyendo bienes nacionales e importados.',
        nac: 'Componente de bienes de <strong>origen nacional</strong> del IPM. Refleja presiones internas de la cadena productiva.',
        imp: 'Componente de bienes <strong>importados</strong> del IPM. Sensible al tipo de cambio paralelo y costos de internación.'
      };

      SERIES_CFG.forEach(s => {
        if (!active.has(s.key)) return;
        const arr = allSeries[s.key];
        const val = getVal(arr, fecha, view.key);
        const prevVal = prevFecha ? getVal(arr, prevFecha, view.key) : null;
        const delta = (val != null && prevVal != null) ? val - prevVal : null;

        blocks.push(`
          <div class="panel-block">
            <div class="panel-label" style="color:${s.color}; background:${bgAlpha[s.key]}; border-left-color:${s.color}">${labels[s.key]}</div>
            <div class="panel-val" style="color:${s.color}">${val != null ? view.fmt(val) : '—'}</div>
            <p class="panel-desc">${descs[s.key]}${delta != null ? ` Cambio: <span class="delta-tag ${dtClasses[s.key]}">${(delta >= 0 ? '+' : '') + delta.toFixed(1)} pp</span>` : ''}</p>
          </div>
        `);
      });

      const ippV = getVal(allSeries.ipp, fecha, 'var_12_meses');
      const ipmV = getVal(allSeries.ipm, fecha, 'var_12_meses');
      const nacV = getVal(allSeries.nac, fecha, 'var_12_meses');
      const impV = getVal(allSeries.imp, fecha, 'var_12_meses');

      let analysis = '';
      if (view.key === 'var_12_meses' && ippV != null && ipmV != null) {
        const maxV = Math.max(ippV, ipmV);
        const diff = Math.abs(ippV - ipmV).toFixed(1);
        const impNacDiff = (impV != null && nacV != null) ? (impV - nacV).toFixed(1) : null;

        if (maxV > 20) {
          analysis = `<strong>Presiones inflacionarias severas en la cadena productiva.</strong> IPP en <span class="delta-tag dt-blue">${fpct(ippV)}</span> e IPM en <span class="delta-tag dt-amber">${fpct(ipmV)}</span> — la brecha de ${diff} pp indica ${ippV > ipmV ? 'que el canal mayorista absorbe parte del impacto' : 'que los costos de distribución e importación amplifican las presiones'}.${impNacDiff ? ` La diferencia importado-nacional de <span class="delta-tag dt-red">${impNacDiff} pp</span> refleja ${impV > nacV ? 'el peso del tipo de cambio paralelo sobre insumos importados' : 'que las presiones son mayormente de origen interno'}.` : ''}`;
        } else if (maxV > 10) {
          analysis = `<strong>Presiones significativas en precios de producción y distribución.</strong> Con el IPP en <span class="delta-tag dt-blue">${fpct(ippV)}</span> y el IPM en <span class="delta-tag dt-amber">${fpct(ipmV)}</span>, la diferencia de ${diff} pp sugiere ${ippV > ipmV ? 'que los intermediarios absorben parte del alza' : 'presiones adicionales en la distribución mayorista'}.`;
        } else if (maxV > 4) {
          analysis = `<strong>Presiones moderadas en la cadena de precios.</strong> IPP (+${ippV.toFixed(1)}%) e IPM (+${ipmV.toFixed(1)}%) muestran variaciones por encima del rango de estabilidad. La brecha de ${diff} pp indica ${ippV > ipmV ? 'absorción parcial por intermediarios' : 'márgenes de distribución que amplifican el alza'}.`;
        } else {
          analysis = `<strong>Estabilidad relativa en precios productores y mayoristas.</strong> IPP en ${fpct(ippV)} e IPM en ${fpct(ipmV)} sugieren presiones contenidas a lo largo de la cadena de precios.`;
        }
      } else if (view.key === 'var_mensual') {
        const vals = [ippV, ipmV].filter(v => v != null);
        if (vals.length) {
          const maxM = Math.max(...[getVal(allSeries.ipp, fecha, 'var_mensual'), getVal(allSeries.ipm, fecha, 'var_mensual')].filter(v => v != null));
          analysis = maxM > 1
            ? `Variación mensual superior al 1% — indica un <strong>shock de precios</strong> puntual en la cadena productiva para <strong>${fdate(fecha)}</strong>.`
            : maxM > 0
            ? `Variación mensual positiva moderada en <strong>${fdate(fecha)}</strong>. Las presiones se acumulan mes a mes en la cadena de precios.`
            : `Variación mensual negativa en <strong>${fdate(fecha)}</strong> — alivio temporal en costos, posiblemente estacional.`;
        } else {
          analysis = 'Datos no disponibles para este período.';
        }
      } else if (view.key === 'var_acumulada') {
        const ippAcum = getVal(allSeries.ipp, fecha, 'var_acumulada');
        const ipmAcum = getVal(allSeries.ipm, fecha, 'var_acumulada');
        if (ippAcum != null && ipmAcum != null) {
          const maxA = Math.max(ippAcum, ipmAcum);
          analysis = maxA > 10
            ? `<strong>Acumulado elevado para lo que va del año.</strong> IPP en <span class="delta-tag dt-blue">${fpct(ippAcum)}</span> e IPM en <span class="delta-tag dt-amber">${fpct(ipmAcum)}</span> — a este ritmo, la inflación anual en la cadena productiva será significativa.`
            : maxA > 3
            ? `<strong>Acumulado moderado.</strong> IPP <span class="delta-tag dt-blue">${fpct(ippAcum)}</span> e IPM <span class="delta-tag dt-amber">${fpct(ipmAcum)}</span> desde enero — las presiones se van sumando a lo largo del año.`
            : `Variación acumulada contenida: IPP en ${fpct(ippAcum)} e IPM en ${fpct(ipmAcum)} desde enero. Presiones limitadas en lo que va del año.`;
        } else {
          analysis = 'Seleccione un punto del gráfico para ver el análisis.';
        }
      }

      document.getElementById('panel-body').innerHTML = blocks.join('') +
        `<div class="ctx-box"><p>${analysis}</p></div>`;
    }

    function buildEduBoxes() {
      const lastIPP = ippData[ippData.length - 1] || {};
      const lastIPM = ipmGen[ipmGen.length - 1] || {};
      const lastNac = ipmNac[ipmNac.length - 1] || {};
      const lastImp = ipmImp[ipmImp.length - 1] || {};

      const eduData = [
        {
          title: '¿Qué son el IPP y el IPM?',
          content: `<p>El <strong>Índice de Precios Productor (IPP)</strong> mide la variación de precios a la salida del lugar de producción — fábrica, campo, mina. Es el primer eslabón de la cadena de precios: cuando sube, anticipa presiones que eventualmente llegarán al consumidor.</p>
          <p>El <strong>Índice de Precios al Por Mayor (IPM)</strong> mide los precios en el canal mayorista, donde los bienes pasan del productor o importador al minorista. Incluye tanto bienes de <strong>origen nacional</strong> como <strong>importados</strong>, lo que lo hace sensible a las variaciones del tipo de cambio.</p>`
        },
        {
          title: '¿Cómo se relacionan IPP, IPM e IPC?',
          content: `<p>Los tres índices miden precios en diferentes etapas de la cadena: <strong>IPP → IPM → IPC</strong> (productor → mayorista → consumidor). Las presiones de precios suelen nacer en el IPP, transmitirse al IPM con semanas de rezago, y finalmente llegar al IPC.</p>
          <p>Cuando el IPP sube más que el IPM, los intermediarios absorben parte del costo. Cuando el IPM sube más que el IPP, la brecha cambiaria encarece los <strong>insumos importados</strong>, añadiendo presión en la etapa de distribución.</p>`
        },
        {
          title: 'IPM Nacional vs. Importado',
          content: `<p>El IPM distingue entre bienes de <strong>origen nacional</strong> e <strong>importados</strong>. En un contexto de brecha cambiaria, los bienes importados reflejan el tipo de cambio paralelo, no el oficial. Esto genera una <strong>inflación importada</strong> que se amplifica cuando el boliviano se deprecia de facto.</p>
          <p>Actualmente el componente importado registra <span class="highlight hl-red">${lastImp.var_12_meses != null ? fpct(lastImp.var_12_meses) : '—'}</span> interanual vs. <span class="highlight hl-teal">${lastNac.var_12_meses != null ? fpct(lastNac.var_12_meses) : '—'}</span> del nacional — ${lastImp.var_12_meses > lastNac.var_12_meses ? 'la presión cambiaria encarece significativamente los bienes importados' : 'las presiones son mayormente de origen interno'}.</p>`
        },
        {
          title: '¿Qué significa base 2016=100?',
          content: `<p>Ambos índices usan <strong>2016 como año base</strong> (=100). Esto significa que un índice de <span class="highlight hl-blue">${lastIPP.indice != null ? lastIPP.indice.toFixed(0) : '—'}</span> indica que los precios al productor han subido <strong>${lastIPP.indice != null ? (lastIPP.indice - 100).toFixed(0) : '—'}%</strong> desde 2016. La metodología es <strong>Laspeyres</strong>, que mide el cambio de precios manteniendo fija la canasta de productos del año base.</p>
          <p>El IPP cubre <strong>223 productos</strong> en 6 grupos (agricultura, minería, manufactura, electricidad, agua, construcción), mientras que el IPM cubre el canal de distribución mayorista con distinción por origen.</p>`
        }
      ];

      document.getElementById('edu-boxes').innerHTML = eduData.map(e => `
        <div class="edu-box" onclick="this.classList.toggle('open')">
          <div class="edu-box-toggle">
            <span class="edu-box-title">${e.title}</span>
            <span class="edu-box-arrow">&#9660;</span>
          </div>
          <div class="edu-box-content">${e.content}</div>
        </div>
      `).join('');
    }

    init().then(() => buildEduBoxes());
  })();
  </script>
</body>
</html>
